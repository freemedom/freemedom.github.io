<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>cnblogs / GitHub MD 图片尺寸批量替换</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 16px;
      background: #f5f5f5;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 12px;
    }
    .desc {
      font-size: 13px;
      color: #555;
      margin-bottom: 10px;
    }
    textarea {
      width: 100%;
      min-height: 300px;
      box-sizing: border-box;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      resize: vertical;
      background: #fff;
    }
    .btn-row {
      margin: 10px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    button {
      padding: 6px 14px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      background-color: #3b82f6;
      color: #fff;
      font-size: 13px;
    }
    button:hover {
      background-color: #2563eb;
    }
    .status {
      font-size: 12px;
      color: #16a34a;
    }
    .section-title {
      font-size: 14px;
      margin: 12px 0 6px;
    }
  </style>
</head>
<body>
  <h1>cnblogs / GitHub MD 图片尺寸批量替换</h1>
  <div class="desc">
    粘贴 cnblogs HTML 或 GitHub MD，点击按钮后按内容自动处理，结果会显示在下方并尽量复制到剪贴板。<br>
    <b>cnblogs：</b>把所有 <code>alt="image" /></p></code> 替换成 <code>alt="image" height="642" width="1027" /></p></code>。<br>
    <b>MD：</b>把 <code>&lt;img width="…" height="…" … /&gt;</code> 中 width&gt;500 的缩为 500，height 按原比例取整；width≤500 不变。
  </div>

  <div class="section-title">输入：</div>
  <textarea id="inputArea" placeholder="在这里粘贴需要处理的 cnblogs html 或 GitHub md..."></textarea>

  <div class="btn-row">
    <button id="processBtn">处理并复制</button>
    <span class="status" id="statusText"></span>
  </div>

  <div class="section-title">处理后的结果：</div>
  <textarea id="outputArea" readonly></textarea>

  <script>
    (function () {
      var input = document.getElementById('inputArea');
      var output = document.getElementById('outputArea');
      var btn = document.getElementById('processBtn');
      var status = document.getElementById('statusText');
      var MD_MAX_WIDTH = 400;

      // 给一个示例，方便直接测试
      input.value =
        '<p>&nbsp;</p>\\n';

      function processCnblogs(text) {
        // 只替换 alt="image" 后面直接跟 /></p> 的情况
        return text.replace(/alt="image"\s*\/><\/p>/g, 'alt="image" height="642" width="1027" /></p>');
      }

      function processMd(text) {
        // 匹配带 width / height 的 img 标签，按比例把 width 上限压到 500
        return text.replace(
          /<img\b([^>]*?)\bwidth="(\d+)"([^>]*?)\bheight="(\d+)"([^>]*?)\/?>/gi,
          function (match, beforeW, widthStr, between, heightStr, afterH) {
            var width = parseInt(widthStr, 10);
            var height = parseInt(heightStr, 10);
            if (!(width > MD_MAX_WIDTH) || !height) {
              return match;
            }
            var newHeight = Math.round(height * MD_MAX_WIDTH / width);
            return '<img' + beforeW + 'width="' + MD_MAX_WIDTH + '"' + between +
              'height="' + newHeight + '"' + afterH + (/\/>$/.test(match) ? '/>' : '>');
          }
        ).replace(
          // height 在 width 前面的写法也兼容
          /<img\b([^>]*?)\bheight="(\d+)"([^>]*?)\bwidth="(\d+)"([^>]*?)\/?>/gi,
          function (match, beforeH, heightStr, between, widthStr, afterW) {
            var width = parseInt(widthStr, 10);
            var height = parseInt(heightStr, 10);
            if (!(width > MD_MAX_WIDTH) || !height) {
              return match;
            }
            var newHeight = Math.round(height * MD_MAX_WIDTH / width);
            return '<img' + beforeH + 'height="' + newHeight + '"' + between +
              'width="' + MD_MAX_WIDTH + '"' + afterW + (/\/>$/.test(match) ? '/>' : '>');
          }
        );
      }

      function processText() {
        var text = input.value || '';
        if (!text.trim()) {
          status.textContent = '请输入要处理的文本。';
          output.value = '';
          return;
        }

        // 先处理 MD（已有 width/height），再处理 cnblogs（补尺寸），避免互相干扰
        var replaced = processCnblogs(processMd(text));
        output.value = replaced;

        // 尝试复制到剪贴板
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(replaced).then(function () {
            status.textContent = '处理完成，结果已复制到剪贴板。';
          }).catch(function () {
            status.textContent = '处理完成，但自动复制失败，请手动复制下面的内容。';
          });
        } else {
          // 兼容：选中文本域内容，让用户自己 Ctrl+C
          output.focus();
          output.select();
          status.textContent = '处理完成，请手动复制下面的内容（Ctrl+C）。';
        }
      }

      btn.addEventListener('click', processText);
    })();
  </script>
</body>
</html>
